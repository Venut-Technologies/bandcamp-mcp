name: Release

# Pushing a `vX.Y.Z` tag is what releases. The owner pushes the tag; everything
# below happens here, never from a laptop. If this workflow is red on a tag,
# the release has not happened: delete the tag rather than fixing it in place.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The tag, not a branch: the artifact is built from exactly what was
      # tagged, even if main has moved on since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the newest line CI proves; npm 11 needs it for OIDC
          # No package-manager cache in the publishing job: the OIDC token that
          # publishes to npm lives in this same job, and a poisoned cache would
          # be restored into it. setup-node's own trusted-publishing guide asks
          # for this. The cost is one uncached `npm ci` per release.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs npm 11.5 or newer. Pinned to
      # 11 rather than latest: an npm major can raise its own Node floor above
      # the one this workflow runs on, and then `@latest` fails to install
      # before any check has run.
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@11
          have="$(npm --version)"
          echo "npm $have"
          # Fail here, with a sentence that says what is wrong, rather than at
          # the publish step with an authentication error nobody can read.
          # 11.5.1 is the floor setup-node's own trusted-publishing guide
          # states; below it the publish fails even with OIDC set up correctly.
          if [ "$(printf '%s\n%s\n' "11.5.1" "$have" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $have cannot publish with OIDC; 11.5.1 or newer is required"
            exit 1
          fi

      - run: npm ci

      # The tag says what this release is; package.json is what npm would
      # publish, and the server reports it to every MCP client in its server
      # info. A mismatch means the release commit was not the one tagged, so
      # stop before anything is published or announced.
      - name: The tag and package.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          srv="$(node -p 'require("./server.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg"
            exit 1
          fi
          # server.json is what the registry publishes; CI checks this on every
          # push, and the release checks it again against the tag itself.
          if [ "$tag" != "$srv" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, server.json says $srv"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p 'require("./server.json").name')" >> "$GITHUB_OUTPUT"

      # The same checks CI runs on every push, once more on the tagged commit.
      # Offline, like CI: the tests never reach Bandcamp.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # What ships is dist/ and the three files npm always includes. An
      # allowlist, not a denylist: anything a "files" change lets in — sources,
      # fixtures, notes, a stray dotfile — fails here rather than on npm.
      - name: The tarball carries dist/ and nothing else
        run: >-
          npm pack --dry-run --json | node -e 'let input = "";
          process.stdin.on("data", (chunk) => (input += chunk)).on("end", () => {
          const files = JSON.parse(input)[0].files.map((file) => file.path);
          const missing = ["dist/index.js", "dist/server.js"].filter((path) => !files.includes(path));
          const allowed = ["package.json", "README.md", "LICENSE"];
          const stray = files.filter((path) => !path.startsWith("dist/") && !allowed.includes(path));
          if (missing.length || stray.length) {
          console.error("Missing: " + (missing.join(", ") || "none") + "; not for the tarball: " + (stray.join(", ") || "none"));
          process.exit(1); }
          console.log("Tarball files:\n  " + files.join("\n  ")); });'

      # The package as a user gets it: packed, installed into an empty project,
      # and started the way an MCP client starts it. This is the last point
      # before publishing where a broken entry point can still be caught.
      - name: MCP handshake through the packed and installed bin
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/bandcamp-mcp-*.tgz
          node "$GITHUB_WORKSPACE/scripts/handshake-check.mjs" node_modules/.bin/bandcamp-mcp

      # Release notes are the changelog entry, copied verbatim — never
      # generated from commit titles. A version with no entry is a release
      # nobody wrote notes for, so fail instead of publishing a blank one.
      - name: Take this version's entry out of the changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Stop at the next version heading, or at the link definitions at the
          # foot of the file: for the newest version those definitions would
          # otherwise be swept into the notes and then appended again below.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no entry for $version"
            exit 1
          fi
          # The entry may use reference-style links ([#14]); their definitions
          # live at the foot of the changelog. Without them the notes would
          # render "[#14]" as plain text. Unused definitions render as nothing.
          grep -E '^\[[^]]+\]: ' CHANGELOG.md >> /tmp/notes.md
          cat /tmp/notes.md

      # Idempotent, like the two publishing steps below it: re-running a tag is
      # the normal way to finish a release that failed after this point, and
      # `gh release create` answers an existing release with 422, which would
      # stop the re-run before it reached the step it was started for. The
      # existing release is left exactly as it is — its notes came from the same
      # changelog entry, and rewriting them from a re-run would be a surprise.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag

      # A version can already be on the registry: re-running a tag's workflow
      # is a normal thing to do, and a first publication may have been made by
      # hand. npm refuses to publish over an existing version, which would fail
      # the run after the GitHub Release was already created, so ask the
      # registry first. Only an exact version match skips the publish; anything
      # else — no such package, no such version, a registry error — leaves the
      # answer empty and the publish goes ahead.
      - name: Is this version already on npm?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          found="$(npm view "bandcamp-mcp@$version" version 2>/dev/null || true)"
          if [ "$found" = "$version" ]; then
            echo "already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "not on the registry yet, publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm verifies this repository and this workflow file
      # through OIDC, so there is no token to store, rotate or leak. Provenance
      # ties the published tarball to this run. Skipped when the step above
      # found this exact version already on the registry.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # The MCP Registry entry is server.json, published from here. The registry
      # trusts this repository through the job's OIDC token, so there is nothing
      # to store: interactive login into an organization namespace currently
      # returns 403 (registry issues #1649, #1537), and a token would be the
      # wrong answer anyway.
      #
      # Same idea as the npm guard above: a re-run of a tag, or a version first
      # published by hand, must not fail the release. `search` is a fuzzy match,
      # so the name is compared exactly before the answer is believed.
      - name: Is this version already in the MCP Registry?
        id: registered
        env:
          MCP_NAME: ${{ steps.version.outputs.name }}
          MCP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          found="$(curl -sSfL --retry 3 --retry-all-errors --get \
            --data-urlencode "search=$MCP_NAME" \
            --data-urlencode "version=$MCP_VERSION" \
            https://registry.modelcontextprotocol.io/v0/servers \
            | node -e 'let input = "";
              process.stdin.on("data", (chunk) => (input += chunk)).on("end", () => {
                const servers = JSON.parse(input).servers ?? [];
                const hit = servers.some((entry) =>
                  entry.server?.name === process.env.MCP_NAME &&
                  entry.server?.version === process.env.MCP_VERSION);
                process.stdout.write(hit ? "yes" : "no");
              });')"
          if [ "$found" = "yes" ]; then
            echo "$MCP_NAME $MCP_VERSION is already in the registry, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$MCP_NAME $MCP_VERSION is not in the registry yet, publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to a release and verified by checksum: this job holds an OIDC
      # token, so a moving "latest" download is not something to run in it.
      - name: Install mcp-publisher
        if: steps.registered.outputs.skip != 'true'
        env:
          PUBLISHER_VERSION: "1.8.1"
          PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -sSfL --retry 3 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # The registry does not take our word for the package: it asks npm whether
      # this version exists, and answers 400 if it does not. npm says plainly
      # that a publish "may take a few minutes to become available" — 0.1.1 was
      # registered two seconds after publishing and lost that race, so the
      # release went red with the package already on npm. Wait here instead.
      - name: npm is serving this version
        if: steps.registered.outputs.skip != 'true'
        env:
          MCP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          deadline=$((SECONDS + 300))
          until npm view "bandcamp-mcp@$MCP_VERSION" version >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "npm has not served bandcamp-mcp@$MCP_VERSION for five minutes."
              echo "The registry checks npm itself, so registering now would fail with 400."
              echo "The package is published; re-run this workflow once npm serves it."
              exit 1
            fi
            echo "npm does not serve $MCP_VERSION yet; waiting"
            sleep 15
          done
          echo "npm serves bandcamp-mcp@$MCP_VERSION"

      # validate first: a schema problem should read as a schema problem, not as
      # an authentication failure three steps later.
      - name: Publish to the MCP Registry
        if: steps.registered.outputs.skip != 'true'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          # npm can still answer the registry with a stale 404 after it has
          # answered us, so retry that one failure — a 400 naming this version
          # as not found — and nothing else. A schema or auth error must fail
          # on the first attempt, not three minutes later.
          for attempt in 1 2 3; do
            if output="$(./mcp-publisher publish 2>&1)"; then
              echo "$output"
              exit 0
            fi
            echo "$output"
            case "$output" in
              *"status 400"*"was not found"*) ;;
              *)
                echo "Not the npm-propagation failure; not retrying."
                exit 1
                ;;
            esac
            echo "Attempt $attempt: the registry cannot see this version on npm yet; waiting"
            sleep 30
          done
          echo "The registry could not see bandcamp-mcp@${{ steps.version.outputs.version }} on npm after three attempts."
          exit 1
